<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Clinic Queue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap">
<style>
/* ===== Palette: edit here ===== */
:root{--cream:#FFF6DC;--blue:#CFE8F7;--pink:#FFC8DD;--red:#E5484D;--mint:#CDEBD0;--lav:#D9CCF5;--brown:#6B4F3A;--orange:#FFD9A8;--grey:#E3E0DC;--card:#FFFDF5;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;color:var(--brown);font-family:Nunito,system-ui,sans-serif;font-weight:700;
background:linear-gradient(90deg,#cfe8f755 50%,transparent 50%) 0 0/48px 48px,linear-gradient(#cfe8f755 50%,transparent 50%) 0 0/48px 48px,var(--cream)}
h1,h2,h3,.fr{font-family:Fredoka,sans-serif;font-weight:600;margin:0}
.awning{height:30px;background:radial-gradient(circle at 20px 0,var(--blue) 19px,transparent 20px) 0 0/40px 30px repeat-x,var(--cream);border-bottom:3px dashed var(--blue)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.ribbon{background:var(--red);color:#fff;padding:6px 26px;border-radius:6px;position:relative;font-family:Fredoka;font-size:1.2rem;transform:rotate(-1.5deg);box-shadow:0 3px 0 #b8363a}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 8px}
nav button,.btn{font:inherit;font-family:Fredoka;border:2px solid var(--brown);background:var(--card);color:var(--brown);border-radius:999px;padding:8px 16px;cursor:pointer;transition:.15s;font-size:.95rem}
nav button:hover,.btn:hover{transform:translateY(-2px) rotate(-1deg);background:var(--pink)}
nav button.on{background:var(--pink)}
.btn:active,nav button:active{transform:scale(.93)}
.btn.pri{background:var(--red);color:#fff;border-color:#b8363a}.btn.pri:hover{background:#d13b40}
.btn.sm{padding:4px 12px;font-size:.85rem}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
main{max-width:980px;margin:0 auto;padding:12px 16px 90px}
.board{background:var(--pink);border-radius:28px;padding:16px;border:3px solid #fff;box-shadow:0 6px 0 #f3a5c4}
.card{background:var(--card);border:3px dashed var(--brown);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 5px 12px #6b4f3a22}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border-radius:22px;padding:14px;text-align:center;border:2px dashed var(--brown)}
.stat b{display:block;font-family:Fredoka;font-size:2rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:2px dotted #6b4f3a44;padding:10px 0}
.row:last-child{border:0}
.tag{display:inline-block;padding:2px 12px;border-radius:999px;font-size:.8rem;border:2px solid var(--brown);font-family:Fredoka;transform:rotate(-2deg)}
.Pending{background:#FFF0A8}.Accepted{background:var(--mint)}.Rejected{background:#FFB3B8}.Rescheduled{background:var(--lav)}.Waiting{background:var(--blue)}.Called{background:var(--orange)}.InService{background:var(--pink)}.Done{background:#B6E8C0}.No-show,.Cancelled,.Full{background:var(--grey)}
.qn{font-family:Fredoka;font-size:1.4rem;background:var(--red);color:#fff;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;flex:none;border:3px solid #fff;box-shadow:0 0 0 2px var(--red)}
label{display:block;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--brown);border-radius:16px;background:#fff;color:var(--brown)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{border:2px solid var(--brown);border-radius:16px;background:var(--mint);padding:6px;text-align:center;cursor:pointer;font:inherit}
.slot.sel{background:var(--red);color:#fff}.slot:disabled{background:var(--grey);cursor:not-allowed}
.msg{padding:10px 14px;border-radius:16px;margin:10px 0;border:2px dashed var(--brown)}
.ok{background:var(--mint)}.err{background:#FFB3B8}
.bar{height:22px;border-radius:12px;border:2px solid var(--brown);margin:4px 0}
.modal{position:fixed;inset:0;background:#6b4f3a88;display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:420px;width:100%;margin:0}
.star{position:fixed;font-size:22px;opacity:.6;animation:fl 5s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes fl{50%{transform:translateY(-14px) rotate(20deg)}}
@media(prefers-reduced-motion:reduce){.star{animation:none}*{transition:none!important}}
footer{position:fixed;bottom:0;left:0;right:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;background:var(--blue);border-top:3px dashed var(--brown);font-size:.85rem}
.hide{display:none!important}
:root{--teal:#BFE9E4}
main{position:relative;z-index:1}
.stk{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 3px #6b4f3a44)}
.star{opacity:.9}
.card{position:relative}
.card::before{content:"✚";position:absolute;top:-12px;right:14px;background:#fff;color:var(--red);border:2px solid var(--red);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;transform:rotate(8deg);font-size:16px}
.hosp{margin:0 16px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sign{background:#fff;border:3px solid var(--teal);border-radius:20px;padding:6px 14px;display:flex;align-items:center;gap:8px;font-family:Fredoka;box-shadow:0 3px 0 var(--teal)}
.news{background:#FFEBD2;border:2px solid var(--brown);border-radius:8px;padding:6px 12px;transform:rotate(1.5deg);font-size:.8rem;max-width:260px}
.news b{font-family:Fredoka;color:#f06fa6;font-size:1rem}
.patch{height:34px;margin:0 16px 6px;border-radius:14px;border:2px dashed var(--brown);background:radial-gradient(circle at 12px 12px,var(--red) 5px,transparent 6px) 0 0/32px 24px,linear-gradient(90deg,#ffc8dd88 50%,#cfe8f788 50%) 0 0/64px 100%,var(--cream)}
.board{position:relative}
.board::before,.board::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:linear-gradient(90deg,#ff7aa88a 50%,transparent 50%) 0 0/16px 16px,linear-gradient(#ff7aa88a 50%,transparent 50%) 0 0/16px 16px,#ffd3e3;border:2px solid #fff;bottom:-20px}
.board::before{left:-10px}.board::after{right:-10px}
</style></head><body>
<svg class="star stk" style="top:22%;left:2%" width="46" height="46"><use href="#st"/></svg><svg class="star stk" style="top:12%;right:3%;animation-delay:.5s" width="40" height="40"><use href="#fl"/></svg><svg class="star stk" style="top:46%;right:2%;animation-delay:1.5s" width="48" height="28"><use href="#bw"/></svg><svg class="star stk" style="top:70%;left:2%;animation-delay:2.5s" width="40" height="40"><use href="#mu"/></svg><svg class="star stk" style="top:84%;right:4%;animation-delay:3s" width="50" height="40"><use href="#rb"/></svg>

<header>
<svg width="0" height="0" style="position:absolute"><symbol id="doc" viewBox="0 0 100 110"><path d="M15 110Q15 72 50 72Q85 72 85 110Z" fill="#fff" stroke="#6B4F3A" stroke-width="2.5"/><path d="M38 74L50 94L62 74" fill="#BFE9E4" stroke="#6B4F3A" stroke-width="2"/><path d="M50 8C22 8 18 34 20 52C22 66 32 76 50 76C68 76 78 66 80 52C82 34 78 8 50 8Z" fill="#7ED3C6" stroke="#6B4F3A" stroke-width="2.5"/><path d="M50 11v9M45.5 15.5h9" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/><ellipse cx="50" cy="46" rx="21" ry="22" fill="#FFE7C2" stroke="#6B4F3A" stroke-width="2"/><circle cx="42" cy="45" r="2.6" fill="#6B4F3A"/><circle cx="58" cy="45" r="2.6" fill="#6B4F3A"/><circle cx="36" cy="54" r="4.5" fill="#FFC8DD"/><circle cx="64" cy="54" r="4.5" fill="#FFC8DD"/><path d="M44 55Q50 61 56 55" stroke="#6B4F3A" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M36 78Q34 98 50 98Q66 98 64 78" stroke="#6B4F3A" stroke-width="2.5" fill="none"/><circle cx="50" cy="100" r="4" fill="#FFC8DD" stroke="#6B4F3A" stroke-width="2"/><path d="M72 90v8M68 94h8" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/></symbol></svg>
<svg width="0" height="0" style="position:absolute"><symbol id="rb" viewBox="0 0 80 50"><path d="M6 46A34 34 0 0 1 74 46" fill="none" stroke="#FFC8DD" stroke-width="7"/><path d="M13 46A27 27 0 0 1 67 46" fill="none" stroke="#FFE08A" stroke-width="7"/><path d="M20 46A20 20 0 0 1 60 46" fill="none" stroke="#CFE8F7" stroke-width="7"/><g fill="#fff" stroke="#6B4F3A" stroke-width="2"><circle cx="10" cy="43" r="7"/><circle cx="21" cy="46" r="6"/><circle cx="70" cy="43" r="7"/><circle cx="59" cy="46" r="6"/></g></symbol><symbol id="mu" viewBox="0 0 50 50"><path d="M18 30h14v12a7 7 0 0 1-14 0z" fill="#FFF6DC" stroke="#6B4F3A" stroke-width="2"/><path d="M4 30C4 8 46 8 46 30z" fill="#E5484D" stroke="#6B4F3A" stroke-width="2"/><g fill="#fff"><circle cx="16" cy="22" r="4"/><circle cx="30" cy="17" r="3.5"/><circle cx="37" cy="25" r="3"/></g></symbol><symbol id="en" viewBox="0 0 70 50"><rect x="3" y="6" width="64" height="40" rx="6" fill="#fff" stroke="#6B4F3A" stroke-width="2.5"/><path d="M5 10L35 32L65 10" fill="none" stroke="#6B4F3A" stroke-width="2.5"/><circle cx="35" cy="31" r="7" fill="#E5484D"/><path d="M35 27v8M31 31h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></symbol><symbol id="bi" viewBox="0 0 70 60"><rect x="4" y="4" width="62" height="52" rx="9" fill="#F06FA6" stroke="#6B4F3A" stroke-width="2.5"/><rect x="14" y="10" width="48" height="40" rx="4" fill="#fff"/><path d="M22 20h30M22 28h30M22 36h18" stroke="#FFC8DD" stroke-width="3" stroke-linecap="round"/><g fill="#D9CCF5" stroke="#6B4F3A" stroke-width="1.5"><rect x="3" y="14" width="18" height="7" rx="3.5"/><rect x="3" y="27" width="18" height="7" rx="3.5"/><rect x="3" y="40" width="18" height="7" rx="3.5"/></g><path d="M50 44v8M46 48h8" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/></symbol><symbol id="ho" viewBox="0 0 120 90"><rect x="20" y="25" width="80" height="60" rx="6" fill="#fff" stroke="#6B4F3A" stroke-width="2.5"/><rect x="38" y="6" width="44" height="24" rx="7" fill="#FFC8DD" stroke="#6B4F3A" stroke-width="2.5"/><path d="M60 11v14M53 18h14" stroke="#E5484D" stroke-width="4.5" stroke-linecap="round"/><g fill="#CFE8F7" stroke="#6B4F3A" stroke-width="2"><rect x="28" y="42" width="16" height="14" rx="3"/><rect x="76" y="42" width="16" height="14" rx="3"/></g><rect x="50" y="58" width="20" height="27" rx="4" fill="#CDEBD0" stroke="#6B4F3A" stroke-width="2"/><path d="M46 56h28" stroke="#CFE8F7" stroke-width="6" stroke-dasharray="7 3"/><circle cx="12" cy="78" r="10" fill="#CDEBD0" stroke="#6B4F3A" stroke-width="2"/><circle cx="108" cy="78" r="10" fill="#CDEBD0" stroke="#6B4F3A" stroke-width="2"/></symbol><symbol id="st" viewBox="0 0 40 40"><polygon points="20,2 25,15 39,15 28,24 32,38 20,30 8,38 12,24 1,15 15,15" fill="#FFB3BD" stroke="#E5484D" stroke-width="2" stroke-linejoin="round"/><path d="M20 8v22M9 20h22" stroke="#fff" stroke-width="2" opacity=".7"/></symbol><symbol id="bw" viewBox="0 0 40 24"><path d="M20 12L4 2V22ZM20 12L36 2V22Z" fill="#FFC8DD" stroke="#6B4F3A" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="12" r="4" fill="#E5484D"/></symbol><symbol id="fl" viewBox="0 0 40 40"><g fill="#CFE8F7" stroke="#6B4F3A" stroke-width="1.8"><circle cx="20" cy="9" r="7"/><circle cx="31" cy="20" r="7"/><circle cx="20" cy="31" r="7"/><circle cx="9" cy="20" r="7"/></g><circle cx="20" cy="20" r="5" fill="#FFE08A" stroke="#6B4F3A" stroke-width="1.8"/></symbol></svg>
<svg width="66" height="73"><use href="#doc"/></svg>
<svg width="44" height="44" viewBox="0 0 64 64" aria-label="Tomato mascot" style="margin-left:-14px;margin-top:30px"><path d="M32 12c-4-6-12-6-14-2 6 0 8 2 8 4-6-1-9 2-9 3 4 1 8 0 11 0z" fill="#7bb36f"/><circle cx="32" cy="38" r="22" fill="#E5484D" stroke="#6B4F3A" stroke-width="2.5"/><circle cx="24" cy="36" r="2.5" fill="#6B4F3A"/><circle cx="40" cy="36" r="2.5" fill="#6B4F3A"/><circle cx="19" cy="42" r="4" fill="#FFC8DD"/><circle cx="45" cy="42" r="4" fill="#FFC8DD"/><path d="M27 43q5 5 10 0" stroke="#6B4F3A" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M50 22v8m-4-4h8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
<div><h1 class="ribbon" id="ttl">Campus Clinic</h1></div>
<div style="margin-left:auto" id="who"></div>
</header>
<nav id="nav"></nav>
<div class="hosp"><svg class="stk" width="64" height="48"><use href="#ho"/></svg><div class="sign"><b style="color:var(--red);font-size:1.4rem">✚</b> Campus Health Center<svg width="70" height="22" viewBox="0 0 70 22"><polyline points="0,12 16,12 22,3 28,20 34,12 70,12" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="news"><b>HEALTH NEWS</b> Vol.1<br>Drink water &amp; go outside, you got this!</div><span style="display:flex;gap:10px;align-items:center"><svg class="stk" width="64" height="40" style="transform:rotate(-6deg)"><use href="#rb"/></svg><svg class="stk" width="40" height="40" style="transform:rotate(5deg)"><use href="#mu"/></svg><svg class="stk" width="56" height="40" style="transform:rotate(-4deg)"><use href="#en"/></svg><svg class="stk" width="52" height="46" style="transform:rotate(6deg)"><use href="#bi"/></svg></span></div><div class="patch"></div>
<main id="main"></main>
<footer><span id="hc"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#4caf70"></i> System OK</span><span>Mon–Fri · 08:00–15:00</span></footer>
<div id="modal"></div>
<script>
/* ===== Dummy data (replace with API calls: /api/auth/login, /api/slots, /api/appointments, /api/queue/today, /api/dashboard/summary, /api/health) ===== */
const ymd=d=>d.toISOString().slice(0,10);
const nextWD=(d)=>{d=new Date(d);while([0,6].includes(d.getDay()))d.setDate(d.getDate()+1);return d};
let days=[];{let d=nextWD(new Date());for(let i=0;i<4;i++){days.push(ymd(d));d=nextWD(new Date(d.getTime()+864e5))}}
const TODAY=days[0]; // clinic day used for the queue
let users=[{id:1,name:"Admin Annie",email:"admin@campus.edu",pw:"admin123",role:"admin"},{id:2,name:"Nurse Nina",email:"nina@campus.edu",pw:"staff123",role:"staff"},{id:3,name:"Dr. Dimas",email:"dimas@campus.edu",pw:"staff123",role:"staff"},{id:4,name:"Sari Student",email:"sari@campus.edu",pw:"student123",role:"student"},{id:5,name:"Budi Student",email:"budi@campus.edu",pw:"student123",role:"student"},{id:6,name:"Citra Student",email:"citra@campus.edu",pw:"student123",role:"student"}];
let services=["General Consultation","Light Examination","Health Certificate","Counseling"];
const svcColor=[ "var(--pink)","var(--blue)","var(--mint)","var(--lav)"];
let slots=[];
(function(){let id=1;days.forEach(d=>{for(let m=480;m<900;m+=30){const f=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");slots.push({id:id++,date:d,start:f(m),end:f(m+30),quota:2,booked:0})}})})();
let appts=[],aid=1;
function seed(uid,svc,date,time,note,status,extra={}){const s=slots.find(x=>x.date==date&&x.start==time);if(s&&!["Rejected","Cancelled"].includes(status))s.booked++;appts.push({id:aid++,uid,svc,date,time,note,status,reason:"",q:null,qs:null,...extra})}
seed(4,0,TODAY,"08:00","Headache since morning","Accepted",{q:1,qs:"Done"});
seed(5,1,TODAY,"08:30","Sprained ankle","Accepted",{q:2,qs:"In Service"});
seed(6,3,TODAY,"09:00","Feeling stressed before exams","Accepted",{q:3,qs:"Waiting"});
seed(4,2,days[1],"09:00","Need certificate for internship","Pending");
seed(5,0,days[1],"10:00","Sore throat","Pending");
seed(6,0,days[2],"10:30","Fever","Rejected",{reason:"Please visit the ER for high fever."});
let me=null,view="",tab="up";
const $=id=>document.getElementById(id);
const cls=s=>s.replace(/ /g,"");
const tag=s=>`<span class="tag ${cls(s)}">${s}</span>`;
const uname=id=>users.find(u=>u.id==id)?.name||"?";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const left=s=>s.quota-s.booked;

/* ===== Auth ===== */
function loginView(){$("nav").innerHTML="";$("who").innerHTML="";$("main").innerHTML=`<div class="card" style="max-width:440px;margin:20px auto"><div style="text-align:center"><svg width="120" height="132"><use href="#doc"/></svg><svg class="stk" width="110" height="82"><use href="#ho"/></svg></div><h2 style="text-align:center">Welcome in!</h2><label>I am a</label><select id="role"><option value="student">Student</option><option value="staff">Staff</option><option value="admin">Admin</option></select><label>Email</label><input id="em" type="email" value="sari@campus.edu"><label>Password</label><input id="pw" type="password" value="student123"><div id="lm"></div><button class="btn pri" onclick="login()">Sign in</button> <button class="btn" onclick="registerStudent()">Register as student</button><p style="font-size:.85rem">Demo: admin@campus.edu / admin123 · nina@campus.edu / staff123 · sari@campus.edu / student123</p></div>`}
function login(){const r=$("role").value,e=$("em").value.trim(),p=$("pw").value;
if(!/^\S+@\S+\.\S+$/.test(e)||!p)return msg("lm","Enter a valid email and password.",1);
const u=users.find(u=>u.email==e&&u.pw==p&&u.role==r);if(!u)return msg("lm","Wrong credentials or role. Check the demo accounts below.",1);
me=u;go(r=="student"?"book":"pending")}
function registerStudent(){const e=$("em").value.trim(),p=$("pw").value;
if(!/^\S+@\S+\.\S+$/.test(e)||p.length<6)return msg("lm","Use a valid email and a password of 6+ characters.",1);
if(users.some(u=>u.email==e))return msg("lm","That email is already registered.",1);
users.push({id:users.length+1,name:e.split("@")[0],email:e,pw:p,role:"student"});msg("lm","Registered! Now sign in.")}
function logout(){me=null;loginView()}
function msg(id,t,bad){$(id).innerHTML=`<div class="msg ${bad?"err":"ok"}">${t}</div>`}

/* ===== Navigation (role-based) ===== */
const menus={student:[["book","Book"],["mine","My Appointments"]],staff:[["pending","Pending"],["queue","Today's Queue"],["dash","Dashboard"]],admin:[["pending","Pending"],["queue","Today's Queue"],["dash","Dashboard"],["manage","Services & Slots"],["users","Users"]]};
function go(v){if(!menus[me.role].some(m=>m[0]==v))return;view=v;
$("who").innerHTML=`${esc(me.name)} <button class="btn sm" onclick="logout()">Log out</button>`;
$("nav").innerHTML=menus[me.role].map(m=>`<button class="${m[0]==v?"on":""}" onclick="go('${m[0]}')">${m[1]}</button>`).join("");
$("main").innerHTML=({book:bookView,mine:mineView,pending:pendingView,queue:queueView,dash:dashView,manage:manageView,users:usersView})[v]()}

/* ===== Student: book ===== */
let bk={svc:0,date:null,slot:null};
function bookView(){bk.date=bk.date||days[0];
return `<div class="card"><h2>Book an appointment</h2><label>Service</label><select id="bs" onchange="bk.svc=+this.value">${services.map((s,i)=>`<option value="${i}" ${i==bk.svc?"selected":""}>${s}</option>`).join("")}</select>
<label>Date</label><select id="bd" onchange="bk.date=this.value;bk.slot=null;go('book')">${days.map(d=>`<option ${d==bk.date?"selected":""}>${d}</option>`).join("")}</select>
<label>Available slots</label><div class="slots">${slots.filter(s=>s.date==bk.date).map(s=>{const f=left(s)<=0;return `<button class="slot ${bk.slot==s.id?"sel":""}" ${f?"disabled":""} onclick="bk.slot=${s.id};go('book')">${s.start}<br><small>${f?'<span class="tag Full">Full</span>':left(s)+" left"}</small></button>`}).join("")}</div>
<label>Short complaint (required)</label><textarea id="bn" rows="3" maxlength="200" placeholder="e.g. headache since morning"></textarea><div id="bm"></div>
<button class="btn pri" onclick="submitAppointment()">Send request</button></div>`}
function submitAppointment(){const note=$("bn").value.trim(),s=slots.find(x=>x.id==bk.slot);
if(!s)return msg("bm","Please pick a time slot.",1);if(!note)return msg("bm","Please add a short complaint.",1);
if(s.booked>=s.quota)return msg("bm","Sorry, that slot is full. Pick another one.",1);
if(appts.some(a=>a.uid==me.id&&a.date==s.date&&a.time==s.start&&!["Rejected","Cancelled"].includes(a.status)))return msg("bm","You already booked this time.",1);
s.booked++;appts.push({id:aid++,uid:me.id,svc:bk.svc,date:s.date,time:s.start,note,status:"Pending",reason:"",q:null,qs:null});
bk.slot=null;go("book");msg("bm","Request sent! Status: Pending")}

/* ===== Student: my appointments ===== */
function mineView(){const mine=appts.filter(a=>a.uid==me.id),hist=mine.filter(a=>a.qs=="Done"||a.qs=="No-show"),up=mine.filter(a=>!hist.includes(a));
const list=a=>`<div class="row"><div><b>${services[a.svc]}</b><br>${a.date} · ${a.time}<br><small>${esc(a.note)}</small>${a.q?`<br>Queue #${a.q}`:""}${a.reason?`<br><small>Reason: ${esc(a.reason)}</small>`:""}</div><div>${tag(a.qs&&a.status=="Accepted"?a.qs:a.status)}${["Pending","Accepted"].includes(a.status)&&(!a.qs||a.qs=="Waiting")?` <button class="btn sm" onclick="cancelAppointment(${a.id})">Cancel</button>`:""}</div></div>`;
const L=tab=="up"?up:hist;
return `<div class="card"><h2>My appointments</h2><button class="btn sm ${tab=="up"?"pri":""}" onclick="tab='up';go('mine')">Upcoming</button> <button class="btn sm ${tab=="h"?"pri":""}" onclick="tab='h';go('mine')">Visit history</button>${L.map(list).join("")||"<p>Nothing here yet. Book your first visit!</p>"}</div>`}
function cancelAppointment(id){const a=appts.find(x=>x.id==id);if(!confirm("Cancel this appointment?"))return;a.status="Cancelled";a.qs=null;const s=slots.find(x=>x.date==a.date&&x.start==a.time);if(s)s.booked--;go("mine")}

/* ===== Staff: pending ===== */
function pendingView(){const p=appts.filter(a=>a.status=="Pending");
return `<div class="card"><h2>Pending requests</h2>${p.map(a=>`<div class="row"><div><b>${esc(uname(a.uid))}</b> · ${services[a.svc]}<br>${a.date} ${a.time}<br><small>${esc(a.note)}</small></div><div>${tag(a.status)}<br><button class="btn sm pri" onclick="acceptAppointment(${a.id})">Accept</button> <button class="btn sm" onclick="modalReject(${a.id})">Reject</button> <button class="btn sm" onclick="modalResched(${a.id})">Reschedule</button></div></div>`).join("")||"<p>All caught up!</p>"}</div>`}
function nextQueueNo(date){return Math.max(0,...appts.filter(a=>a.date==date&&a.q).map(a=>a.q))+1}
function acceptAppointment(id){const a=appts.find(x=>x.id==id);a.status="Accepted";a.q=nextQueueNo(a.date);a.qs="Waiting";go("pending")}
function closeModal(){$("modal").innerHTML=""}
function modalReject(id){$("modal").innerHTML=`<div class="modal"><div class="card"><h3>Reject request</h3><label>Reason (required)</label><textarea id="rr" rows="3"></textarea><div id="rm"></div><button class="btn pri" onclick="rejectAppointment(${id})">Reject</button> <button class="btn" onclick="closeModal()">Back</button></div></div>`}
function rejectAppointment(id){const r=$("rr").value.trim();if(!r)return msg("rm","A reason is required.",1);const a=appts.find(x=>x.id==id);a.status="Rejected";a.reason=r;const s=slots.find(x=>x.date==a.date&&x.start==a.time);if(s)s.booked--;closeModal();go("pending")}
function modalResched(id){const opts=slots.filter(s=>left(s)>0).map(s=>`<option value="${s.id}">${s.date} ${s.start}</option>`).join("");
$("modal").innerHTML=`<div class="modal"><div class="card"><h3>Reschedule</h3><label>New slot</label><select id="rs">${opts}</select><br><br><button class="btn pri" onclick="rescheduleAppointment(${id})">Save</button> <button class="btn" onclick="closeModal()">Back</button></div></div>`}
function rescheduleAppointment(id){const a=appts.find(x=>x.id==id),n=slots.find(x=>x.id==+$("rs").value),o=slots.find(x=>x.date==a.date&&x.start==a.time);if(o)o.booked--;n.booked++;a.date=n.date;a.time=n.start;a.status="Rescheduled";closeModal();go("pending")}

/* ===== Staff: queue (menu board) ===== */
const FLOW={"Waiting":["Called","No-show"],"Called":["In Service","No-show"],"In Service":["Done"]};
function queueView(){const q=appts.filter(a=>a.date==TODAY&&a.q).sort((a,b)=>a.q-b.q);
return `<div class="board"><div style="display:flex;justify-content:center;align-items:flex-end;gap:8px;margin-bottom:10px"><svg width="70" height="77"><use href="#doc"/></svg><span class="ribbon" style="display:inline-block">Today's Queue · ${TODAY}</span><svg class="stk" width="64" height="40"><use href="#rb"/></svg></div><div class="card" style="margin:0;border-style:solid">${q.map(a=>`<div class="row"><div style="display:flex;gap:10px;align-items:center"><div class="qn">${a.q}</div><div><b>${esc(uname(a.uid))}</b><br><small>${services[a.svc]} · ${a.time}</small></div></div><div>${tag(a.qs)}<br>${(FLOW[a.qs]||[]).map(n=>`<button class="btn sm ${n=="No-show"?"":"pri"}" onclick="updateQueueStatus(${a.id},'${n}')">${n}</button>`).join(" ")}</div></div>`).join("")||"<p>No one in the queue yet.</p>"}</div></div>`}
function updateQueueStatus(id,to){const a=appts.find(x=>x.id==id);if(!(FLOW[a.qs]||[]).includes(to))return alert("Invalid transition: steps cannot be skipped.");a.qs=to;go("queue")}

/* ===== Dashboard ===== */
function dashView(){const t=appts.filter(a=>a.date==TODAY&&a.q),c=s=>t.filter(a=>a.qs==s).length;
const st=[["Total today",t.length,"var(--cream)"],["Waiting",c("Waiting"),"var(--blue)"],["In service",c("In Service"),"var(--pink)"],["Done",c("Done"),"var(--mint)"],["No-show",c("No-show"),"var(--grey)"]];
const per=services.map((s,i)=>appts.filter(a=>a.svc==i&&a.status!="Rejected"&&a.status!="Cancelled").length),mx=Math.max(1,...per);
return `<div class="grid">${st.map(s=>`<div class="stat" style="background:${s[2]}"><b>${s[1]}</b>${s[0]}</div>`).join("")}</div><div class="card"><h3>Workload per service</h3>${services.map((s,i)=>`<div>${s} (${per[i]})<div class="bar" style="width:${Math.max(6,per[i]/mx*100)}%;background:${svcColor[i%4]}"></div></div>`).join("")}</div>`}

/* ===== Admin ===== */
function manageView(){return `<div class="card"><h3>Services</h3>${services.map((s,i)=>`<div class="row">${esc(s)} <button class="btn sm" onclick="delService(${i})">Remove</button></div>`).join("")}<div style="display:flex;gap:8px;margin-top:8px"><input id="ns" placeholder="New service name"><button class="btn pri" onclick="addService()">Add</button></div></div>
<div class="card"><h3>Add slot</h3><label>Date</label><input id="sd" type="date"><label>Start</label><input id="s1" type="time" min="08:00" max="14:30" step="1800" value="08:00"><label>End</label><input id="s2" type="time" min="08:30" max="15:00" step="1800" value="08:30"><label>Quota</label><input id="sq" type="number" value="2"><div id="sm"></div><button class="btn pri" onclick="addSlot()">Add slot</button></div>`}
function addService(){const v=$("ns").value.trim();if(v){services.push(v);go("manage")}}
function delService(i){if(appts.some(a=>a.svc==i))return alert("Service is used by appointments.");services.splice(i,1);go("manage")}
function addSlot(){const d=$("sd").value,a=$("s1").value,b=$("s2").value,q=+$("sq").value,dow=new Date(d+"T00:00").getDay();
if(!d||!a||!b)return msg("sm","Fill in date, start and end.",1);
if(!(q>0))return msg("sm","Quota must be greater than 0.",1);
if([0,6].includes(dow))return msg("sm","Clinic is open Mon–Fri only.",1);
if(a<"08:00"||b>"15:00"||a>=b)return msg("sm","Hours must be within 08:00–15:00 and start before end.",1);
slots.push({id:slots.length+1,date:d,start:a,end:b,quota:q,booked:0});msg("sm","Slot added.")}
function usersView(){return `<div class="card"><h3>Users</h3>${users.map(u=>`<div class="row"><span>${esc(u.name)} <small>${u.email}</small></span><span class="tag Waiting">${u.role}</span></div>`).join("")}</div>`}

/* ===== Health check placeholder (/api/health) ===== */
function checkHealth(){$("hc").lastChild.textContent=" System OK"}
loginView();
</script></body></html>
